<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 ばけばけ展示館 （改良版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #0f0a1a;
            color: #bb88ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(187,136,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(136,102,204,0.1) 0%, transparent 50%);
            animation: wave 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes wave {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(5%,5%) rotate(1deg); }
            50% { transform: translate(-3%,3%) rotate(-1deg); }
            75% { transform: translate(3%,-5%) rotate(0.5deg); }
        }

        .scanline {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(187,136,255,0.03) 0px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 64px;
            text-shadow: 0 0 3px #bb88ff, 0 0 5px #bb88ff, 0 0 10px #bb88ff;
            letter-spacing: 10px;
            animation: flicker 3s infinite;
            margin-bottom: 10px;
        }
        @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.97; } }

        .control-panel {
            max-width: 1400px;
            margin: 0 auto 30px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, select {
            background: rgba(187,136,255,0.2);
            border: 2px solid #bb88ff;
            color: #bb88ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover, select:hover {
            background: rgba(187,136,255,0.4);
            box-shadow: 0 0 15px rgba(187,136,255,0.5);
        }

        .debug-btn {
            background: rgba(255,187,136,0.2);
            border-color: #ffbb88;
            color: #ffbb88;
        }
        .debug-btn:hover {
            background: rgba(255,187,136,0.4);
            box-shadow: 0 0 15px rgba(255,187,136,0.5);
        }

        .view-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .view-controls label {
            font-size: 14px;
            color: #bb88ff;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pagination button {
            padding: 8px 15px;
            font-size: 12px;
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 14px;
            color: #bb88ff;
            min-width: 120px;
            text-align: center;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(187,136,255,0.1);
            border-radius: 8px;
            border: 1px solid #bb88ff;
            font-size: 12px;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #bb88ff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .gallery-container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            cursor: grab;
            user-select: none;
        }
        .gallery-container.dragging {
            cursor: grabbing;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
            transition: transform 0.1s ease-out;
        }

        .card {
            background: rgba(20,10,30,0.85);
            border: 2px solid #bb88ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(187,136,255,0.3);
            transition: all 0.3s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 30px rgba(187,136,255,0.6);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid #bb88ff;
        }

        .card-info {
            padding: 15px;
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
            color: #bb88ff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px #bb88ff;
        }
        .card-meta {
            font-size: 11px;
            color: #9966cc;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 24px;
            color: #bb88ff;
            position: relative;
            z-index: 2;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border: 3px solid #bb88ff;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(187,136,255,0.8);
        }

        .firebase-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20,10,30,0.9);
            color: #bb88ff;
            border: 2px solid #bb88ff;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 11px;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(187, 136, 255, 0.3);
        }

        .empty-message {
            text-align: center;
            padding: 80px 20px;
            font-size: 20px;
            color: #9966cc;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 768px) {
            h1 { font-size: 40px; letter-spacing: 5px; }
            .control-panel { flex-direction: column; align-items: stretch; }
            .button-group { justify-content: center; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <header>
        <h1>👻 ばけばけ展示館 👻</h1>
    </header>

    <div class="firebase-indicator" id="firebaseIndicator">
        🔥 Firebase: 接続確認中...
    </div>

    <div class="control-panel">
        <div class="button-group">
            <button onclick="loadFromCloud()">📥 読み込む</button>
            <button onclick="clearGallery()">🗑️ クリア</button>
            <button class="debug-btn" onclick="showDebugInfo()">🔍 デバッグ</button>
        </div>

        <div class="view-controls">
            <label for="itemsPerPage">表示件数:</label>
            <select id="itemsPerPage" onchange="changeItemsPerPage()">
                <option value="10">10件</option>
                <option value="20">20件</option>
                <option value="30" selected>30件</option>
                <option value="all">全件表示</option>
            </select>
        </div>

        <div class="pagination">
            <button onclick="previousPage()" id="prevBtn">◀ 前へ</button>
            <span class="page-info" id="pageInfo">-</span>
            <button onclick="nextPage()" id="nextBtn">次へ ▶</button>
        </div>
        
        <div class="status">
            <div class="status-dot"></div>
            <span id="statusText">待機中</span>
        </div>
    </div>

    <div class="gallery-container" id="galleryContainer">
        <div class="gallery" id="gallery"></div>
    </div>
    
    <div class="loading" id="loading">
        <div>👾 読み込み中... 👾</div>
    </div>
    
    <div class="modal" id="modal" onclick="closeModal()">
        <img id="modalImage" alt="拡大表示">
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // ========================================
        // 🔥 Firebase設定（生成アプリと同じ設定を使用）
        // ========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBwl3fDVTTHpvyYn9fP-AgKVo-bjGZfAK0",
            authDomain: "bakebake-garalley.firebaseapp.com",
            databaseURL: "https://bakebake-garalley-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bakebake-garalley",
            storageBucket: "bakebake-garalley.firebasestorage.app",
            messagingSenderId: "215696593569",
            appId: "1:215696593569:web:35dffc96aae1cb186896e0"
        };

        // Firebase初期化
        let app, database;
        try {
            app = initializeApp(firebaseConfig);
            database = getDatabase(app);
            document.getElementById('firebaseIndicator').textContent = '🔥 Firebase: 接続成功';
            document.getElementById('firebaseIndicator').style.borderColor = '#bb88ff';
            console.log('Firebase initialized successfully');
        } catch (error) {
            document.getElementById('firebaseIndicator').textContent = '🔥 Firebase: 接続エラー';
            document.getElementById('firebaseIndicator').style.borderColor = '#ff8888';
            console.error('Firebase initialization error:', error);
        }

        // グローバルに公開
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseGet = get;
        window.firebaseOnValue = onValue;
    </script>

    <script>
        // ====== グローバル変数 ======
        let allMonsters = [];
        let currentPage = 1;
        let itemsPerPage = 30;

        // ====== ドラッグ機能 ======
        const galleryContainer = document.getElementById('galleryContainer');
        let isDragging = false;
        let startX, startY;
        let scrollLeft, scrollTop;

        galleryContainer.addEventListener('mousedown', (e) => {
            // カードをクリックした場合はドラッグしない
            if (e.target.closest('.card')) return;
            
            isDragging = true;
            galleryContainer.classList.add('dragging');
            startX = e.pageX - galleryContainer.offsetLeft;
            startY = e.pageY - galleryContainer.offsetTop;
            scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        });

        galleryContainer.addEventListener('mouseleave', () => {
            isDragging = false;
            galleryContainer.classList.remove('dragging');
        });

        galleryContainer.addEventListener('mouseup', () => {
            isDragging = false;
            galleryContainer.classList.remove('dragging');
        });

        galleryContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - galleryContainer.offsetLeft;
            const y = e.pageY - galleryContainer.offsetTop;
            const walkX = (x - startX) * 2;
            const walkY = (y - startY) * 2;
            window.scrollTo(scrollLeft - walkX, scrollTop - walkY);
        });

        // ====== 表示件数変更 ======
        function changeItemsPerPage() {
            const select = document.getElementById('itemsPerPage');
            const value = select.value;
            
            if (value === 'all') {
                itemsPerPage = Infinity;
            } else {
                itemsPerPage = parseInt(value);
            }
            
            currentPage = 1;
            renderGallery();
        }

        // ====== ページネーション ======
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderGallery();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(allMonsters.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderGallery();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updatePaginationButtons() {
            const totalPages = Math.ceil(allMonsters.length / itemsPerPage);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages || itemsPerPage === Infinity;

            if (itemsPerPage === Infinity) {
                pageInfo.textContent = `全 ${allMonsters.length} 件`;
            } else {
                const start = (currentPage - 1) * itemsPerPage + 1;
                const end = Math.min(currentPage * itemsPerPage, allMonsters.length);
                pageInfo.textContent = `${start}-${end} / ${allMonsters.length} 件 (${currentPage}/${totalPages}ページ)`;
            }
        }

        // ====== ギャラリー表示 ======
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (allMonsters.length === 0) {
                gallery.innerHTML = '<div class="empty-message">👻 まだ妖怪が展示されていません 👻</div>';
                updatePaginationButtons();
                return;
            }

            // ページング計算
            const start = (currentPage - 1) * itemsPerPage;
            const end = itemsPerPage === Infinity ? allMonsters.length : start + itemsPerPage;
            const displayMonsters = allMonsters.slice(start, end);

            displayMonsters.forEach(monster => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(monster.url);

                const timestamp = monster.timestamp ? new Date(monster.timestamp) : null;
                const timeStr = timestamp ? 
                    `${timestamp.getFullYear()}/${(timestamp.getMonth()+1).toString().padStart(2,'0')}/${timestamp.getDate().toString().padStart(2,'0')} ${timestamp.getHours().toString().padStart(2,'0')}:${timestamp.getMinutes().toString().padStart(2,'0')}` 
                    : '不明';

                card.innerHTML = `
                    <img src="${monster.url}" alt="${monster.name || '妖怪'}" loading="lazy">
                    <div class="card-info">
                        <div class="card-name">${monster.name || '名無しの妖怪'}</div>
                        <div class="card-meta">
                            召喚日時: ${timeStr}<br>
                            忠実度: ${monster.fidelity || '-'}%
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });

            updatePaginationButtons();
        }

        // ====== モーダル ======
        function openModal(url) {
            document.getElementById('modalImage').src = url;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // ESCキーでモーダルを閉じる
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ====== Firebase読み込み ======
        async function loadFromCloud() {
            if (!window.firebaseDB) {
                alert('❌ Firebaseに接続されていません');
                return;
            }

            const loading = document.getElementById('loading');
            const statusText = document.getElementById('statusText');

            loading.style.display = 'block';
            statusText.textContent = '読み込み中...';

            try {
                const monstersRef = window.firebaseRef(window.firebaseDB, 'monsters');
                const snapshot = await window.firebaseGet(monstersRef);

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    allMonsters = Object.entries(data).map(([key, value]) => ({
                        id: key,
                        ...value
                    }));

                    // 新しい順に並び替え
                    allMonsters.sort((a, b) => {
                        const timeA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                        const timeB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                        return timeB - timeA;
                    });

                    currentPage = 1;
                    renderGallery();
                    statusText.textContent = `読み込み完了: ${allMonsters.length}体`;
                } else {
                    allMonsters = [];
                    renderGallery();
                    statusText.textContent = 'データなし';
                }
            } catch (error) {
                console.error('読み込みエラー:', error);
                alert('❌ 読み込みエラー: ' + error.message);
                statusText.textContent = 'エラー';
            } finally {
                loading.style.display = 'none';
            }
        }

        // ====== ギャラリークリア ======
        function clearGallery() {
            if (confirm('展示をクリアしますか？（Firebaseのデータは削除されません）')) {
                allMonsters = [];
                currentPage = 1;
                renderGallery();
                document.getElementById('statusText').textContent = 'クリア完了';
            }
        }

        // ====== デバッグ情報 ======
        function showDebugInfo() {
            const info = `
=== デバッグ情報 ===

表示中: ${allMonsters.length}体
現在のページ: ${currentPage}
1ページあたり: ${itemsPerPage === Infinity ? '全件' : itemsPerPage + '件'}
Firebase接続: ${window.firebaseDB ? '成功' : '失敗'}

お化けリスト:
${allMonsters.slice(0, 5).map((m, i) => `${i + 1}. ${m.name || '名無し'} (${m.timestamp || '不明'})\n   ${m.url.substring(0, 50)}...`).join('\n')}

【確認事項】
✓ Firebase設定が正しく入力されていますか？
✓ Firebaseのセキュリティルールは適切ですか？
✓ 生成アプリと展示館アプリで同じFirebase設定を使っていますか？
            `;
            
            console.log(info);
            alert(info);
        }
        
        // 自動読み込み
        window.addEventListener('load', () => {
            console.log('=== ページ読み込み完了 ===');
            
            // Firebase接続後、3秒待ってから自動読み込み
            setTimeout(() => {
                if (window.firebaseDB) {
                    console.log('自動読み込み実行');
                    loadFromCloud();
                } else {
                    console.log('Firebase未接続');
                    document.getElementById('statusText').textContent = 'Firebase設定が必要';
                }
            }, 3000);
        });

        console.log('✨ ばけばけ展示館（改良版）起動完了 ✨');
    </script>
</body>
</html>
